<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f172a" />
  
  <!-- Clipboard Body with Gradient -->
  <rect x="12" y="14" width="40" height="42" rx="8" fill="url(#bgGrad)" />

  <!-- Clipboard Top Clip -->
  <rect x="24" y="10" width="16" height="8" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />

  <!-- Checkmark -->
  <path d="M22 34 L29 41 L43 25" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>